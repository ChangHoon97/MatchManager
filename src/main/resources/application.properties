spring.application.name=matchmanager

# JSP 뷰 설정
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# 서버 포트
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# 인코딩
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# DB (운영: Railway Postgres 플러그인이 주입하는 PG* 환경변수로 JDBC URL 구성)
# Railway의 DATABASE_URL은 postgresql:// 스킴이라 JDBC 드라이버가 바로 못 쓰므로 PGHOST/PGPORT/PGDATABASE로 조립한다.
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

spring.flyway.enabled=true

# 구글 OAuth2 (운영: Railway 환경변수 GOOGLE_CLIENT_ID/GOOGLE_CLIENT_SECRET 필요 — 배포 전 설정 필수)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
